# PostgreSQL local para desarrollo. Puerto 5435 para no chocar con otros Postgres locales (5432–5434).
services:
  postgres:
    image: postgres:16-alpine
    container_name: raiz-postgres
    environment:
      POSTGRES_DB: raiz
      POSTGRES_USER: raiz
      POSTGRES_PASSWORD: raiz
    ports:
      - "5435:5432"
    volumes:
      - raiz-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raiz -d raiz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  raiz-pgdata:
