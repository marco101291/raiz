spring:
  application:
    name: raiz-backend
  datasource:
    url: ${RAIZ_DB_URL:jdbc:postgresql://localhost:5434/raiz}
    username: ${RAIZ_DB_USER:raiz}
    password: ${RAIZ_DB_PASSWORD:raiz}
  jpa:
    # El esquema lo gobierna Flyway; Hibernate solo valida que las entidades coincidan.
    hibernate:
      ddl-auto: validate
    # Sin sesión abierta durante la vista: las consultas ocurren en la capa de servicio/adaptador.
    open-in-view: false
    properties:
      # Carga las colecciones de varias raíces en una sola consulta (evita N+1 al arrancar).
      hibernate.default_batch_fetch_size: 16
