# Render (and most hosts) assign the port through PORT.
server:
  port: ${PORT:8080}

spring:
  application:
    name: raiz-backend
  datasource:
    url: ${RAIZ_DB_URL:jdbc:postgresql://localhost:5435/raiz}
    username: ${RAIZ_DB_USER:raiz}
    password: ${RAIZ_DB_PASSWORD:raiz}
  jpa:
    # Flyway owns the schema; Hibernate only validates that the entities match.
    hibernate:
      ddl-auto: validate
    # No open session during the view: queries happen in the service/adapter layer.
    open-in-view: false
    properties:
      # Loads the collections of several roots in a single query (avoids N+1 at startup).
      hibernate.default_batch_fetch_size: 16

springdoc:
  # Without this, responses are documented as */* and generated clients lose the types.
  default-produces-media-type: application/json

# Only /actuator/health is exposed: the host's health check and the keep-alive ping use it. It leaves the
# database out so that pinging the backend does not keep Neon's compute awake.
management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    db:
      enabled: false
